<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Ink Board</title>
<meta name="description" content="Two fingers. One board. Push, ollie, flip and grind.">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ink Board">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,800;1,9..144,900&family=Figtree:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="c" aria-label="A skateboard lying on the pavement. Put two fingers on it to skate."></canvas>

<header id="hud" hidden>
  <div><div class="pv" id="score">0</div><div class="sub" id="bestL">No best yet</div></div>
  <div class="tm"><div class="pv" id="time">1:30</div><div class="sub" id="tsub">Push to start</div></div>
</header>
<button id="pause" type="button" aria-label="Pause" hidden>
  <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="9" y="8" width="5" height="16" rx="1.5" fill="currentColor"/><rect x="18" y="8" width="5" height="16" rx="1.5" fill="currentColor"/></svg>
</button>
<div id="combo" aria-live="polite"><b id="comboN"></b><span id="comboP"></span><small id="comboTag"></small></div>
<div id="hint" hidden><span id="hintT"></span><button id="skip" type="button" hidden>Skip</button></div>
<div id="callout"></div>
<div id="card" hidden><div class="panel" id="panel"></div></div>
<script src="js/config.js"></script>
<script src="js/core.js"></script>
<script src="js/world.js"></script>
<script src="js/audio.js"></script>
<script src="js/ui.js"></script>
<script src="js/physics.js"></script>
<script src="js/input.js"></script>
<script src="js/draw.js"></script>
<script src="js/main.js"></script>
<script>if('serviceWorker' in navigator&&location.protocol==='https:') navigator.serviceWorker.register('/sw.js').catch(()=>{});</script>
</body>
</html>
